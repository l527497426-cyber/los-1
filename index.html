<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Fancy Flame — 一关无尽的 Ori 风横版闯关" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0a14" />
  <title>Fancy Flame</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0b0a14;
      color: #eae6d5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Source Han Sans SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #game {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #6e6a55;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="boot">Loading…</div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
