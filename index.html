<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="Fancy Flame — 一关无尽的 Ori 风横版闯关" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0a14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fancy Flame</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0b0a14;
      color: #eae6d5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Source Han Sans SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #6e6a55;
      text-transform: uppercase;
    }
    #rotate {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0b0a14;
      color: #eae6d5;
      text-align: center;
      padding: 24px;
      z-index: 9999;
    }
    #rotate .icon {
      font-size: 48px;
      animation: rot 1.6s ease-in-out infinite;
    }
    #rotate p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #8a8576;
      max-width: 320px;
      line-height: 1.6;
    }
    #rotate p.title {
      font-family: Georgia, serif;
      font-size: 22px;
      color: #f4b03c;
      letter-spacing: 0.02em;
    }
    @keyframes rot {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(90deg); }
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #game { display: none; }
      #boot { display: none; }
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="boot">Loading…</div>
  <div id="game"></div>
  <div id="rotate">
    <div class="icon">⟳</div>
    <p class="title">请横屏</p>
    <p>Fancy Flame 是一款横版游戏，请把手机横过来再玩。</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
